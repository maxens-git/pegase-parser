services:
  pegase-parser:
    image: ghcr.io/maxens-git/pegase-parser:latest
    container_name: pegase-parser
    restart: unless-stopped
    environment:
      - INP_USERNAME=${INP_USERNAME}
      - INP_PASSWORD=${INP_PASSWORD}
      - NTFY_TOPIC=${NTFY_TOPIC}
      - NTFY_SERVER=${NTFY_SERVER:-https://ntfy.sh}
      - NTFY_TOKEN=${NTFY_TOKEN}
      - CRON_SCHEDULE=${CRON_SCHEDULE:-*/15 * * * *}
    volumes:
      - ./data:/app/data

  pegase-api:
    image: ghcr.io/maxens-git/pegase-parser:latest
    container_name: pegase-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    entrypoint: []
    command: ["python", "api.py"]
